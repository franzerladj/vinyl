<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Crate</title>
    <style>
      @font-face { font-family: "Crate Archivo"; src: url("fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      html, body { margin: 0; background: #0b0b0b; }
      body { width: 400px; min-height: 180px; }
      #app { display: block; }
      .search { display: flex; gap: 8px; padding: 0 14px 12px; }
      .search input { flex: 1; min-width: 0; height: 40px; border: 0; outline: none; border-radius: 12px; padding: 0 14px; background: #262626; color: #f5f5f4; font: 400 15px/1 "Inter", system-ui, sans-serif; }
      .search input::placeholder { color: rgba(245, 245, 244, 0.36); }
      .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
      .status { padding: 0 14px 12px; font: 400 12.5px/1.4 "Inter", system-ui, sans-serif; color: rgba(245, 245, 244, 0.62); }
      .status a { color: #c6ff3a; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="panel.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
