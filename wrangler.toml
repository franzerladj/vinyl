# Cloudflare Pages: statische App aus web/dist, API als Pages Functions (functions/)
name = "crate"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "web/dist"

# Kostenloses KI-Kontingent (Bilderkennung, Vibes)
[ai]
binding = "AI"

# Push-Mitteilungen: Abos, Wants mit Wunschpreisen, Erinnerungen (nur für Nutzer, die Mitteilungen einschalten)
[[kv_namespaces]]
binding = "PUSH"
id = "f33e0e0df2c64fe1a72aafd163992684"

# Abgleich eigener Daten zwischen Geräten (BPM, Sets, Notizen …), Schema in server/devsync.ts (SCHEMA)
[[d1_databases]]
binding = "SYNC"
database_name = "crate-sync"
database_id = "9779ba0a-92e1-4d44-96a3-b8d4cb553e02"
