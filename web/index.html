    <style>
      html,body{background:#0b0b0b;margin:0}
      @media (prefers-color-scheme: light){html,body{background:#f2f2f0}}
      /* Startbildschirm: steht sofort, bevor JavaScript geladen ist. Nur transform/opacity animieren (120 Hz). */
      #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0b0b0b;color:#f5f5f4;pointer-events:none;transition:opacity .38s cubic-bezier(.32,.72,0,1)}
      #splash svg{width:min(34vw,150px);height:auto;overflow:visible;will-change:transform}
      #splash .sp-g1,#splash .sp-g2{transform-box:view-box;transform-origin:256px 256px;animation:sp-spin 1s cubic-bezier(.32,.72,0,1) both}
      #splash .sp-g2{animation-delay:.08s;animation-name:sp-spin2}
      #splash .sp-hole{transform-box:view-box;transform-origin:256px 256px;animation:sp-box .5s cubic-bezier(.32,.72,0,1) .3s both}
      #splash .sp-word{font-family:"Archivo Variable",system-ui,sans-serif;font-weight:900;font-size:clamp(44px,13vw,72px);line-height:.9;font-stretch:ultra-expanded;font-variation-settings:"wdth" 125;letter-spacing:-.03em;opacity:0;transform:translateY(14px)}
      #splash .sp-claim{font-family:"JetBrains Mono Variable",ui-monospace,monospace;font-weight:600;font-size:13px;line-height:1;letter-spacing:.02em;color:#c6ff3a;opacity:0;transform:translateY(8px)}
      #splash.fonts .sp-word{animation:sp-rise .6s cubic-bezier(.32,.72,0,1) .1s both}
      #splash.fonts .sp-claim{animation:sp-rise .6s cubic-bezier(.32,.72,0,1) .22s both}
      #splash.out{opacity:0}
      #splash.out svg{transform:scale(1.06);transition:transform .38s cubic-bezier(.32,.72,0,1)}
      @keyframes sp-box{from{transform:scale(.86);opacity:0}}
      @keyframes sp-spin{from{transform:rotate(-140deg);opacity:0}}
      @keyframes sp-spin2{from{transform:rotate(120deg);opacity:0}}
      @keyframes sp-fade{from{opacity:0}}
      @keyframes sp-rise{to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
    </style>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0b" />
    <title>Crate</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="40 40 432 432" xmlns="http://www.w3.org/2000/svg">
        <path class="sp-g1" d="M372 140A164 164 0 1 0 372 372" fill="none" stroke="#c6ff3a" stroke-width="44" stroke-linecap="round"/><path class="sp-g2" d="M323 189A95 95 0 1 0 323 323" fill="none" stroke="#c6ff3a" stroke-width="44" stroke-linecap="round"/><circle class="sp-hole" cx="256" cy="256" r="24" fill="#f5f5f4"/>
      </svg>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
        <span class="sp-word">crate</span>
        <span class="sp-claim">Dig deeper.</span>
      </div>
    </div>
    <div id="root">
      <!-- Wird von der App ersetzt. Für Suchmaschinen und Quellen-Prüfungen steht der Inhalt auch ohne JavaScript bereit. -->
      <main style="max-width:560px;margin:0 auto;padding:48px 20px;font-family:system-ui,sans-serif">
        <h1>Crate</h1>
        <p>Web-App für Vinyl-DJs mit Discogs.</p>
        <p>Datenquellen: <a href="https://www.discogs.com">Discogs</a>, <a href="https://www.deezer.com">Deezer</a>, <a href="https://www.last.fm">Last.fm</a></p>
        <p>Diese App nutzt die Discogs-API, ist aber nicht mit Discogs verbunden, gesponsert oder von Discogs unterstützt. „Discogs“ ist eine Marke von Zink Media, LLC.</p>
        <p><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
