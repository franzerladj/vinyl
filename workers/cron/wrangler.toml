# Zeitplan-Worker für Push-Mitteilungen. Bereitstellen mit:
#   npx wrangler deploy --config workers/cron/wrangler.toml
#   npx wrangler secret put CRON_SECRET --config workers/cron/wrangler.toml
name = "crate-cron"
main = "index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
APP_URL = "https://crate-8vf.pages.dev"

[triggers]
crons = ["*/10 * * * *"]
